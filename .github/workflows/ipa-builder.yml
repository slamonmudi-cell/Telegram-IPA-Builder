name: IPA Builder

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Build request identifier
        required: true
        type: string
      project_path:
        description: Relative path to the uploaded XcodeGen project
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate request
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[a-f0-9]{12}$ ]]
          [[ "$PROJECT_PATH" == "jobs/$JOB_ID/project" ]]
          test -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.yml" || test -f "$PROJECT_PATH/project.yaml"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project and discover scheme
        id: project
        shell: bash
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          xcodegen generate
          PROJECT="$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          schemes = data.get("project", {}).get("schemes", [])
          if not schemes:
              raise SystemExit("No shared scheme found")
          print(schemes[0])
          ')"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build simulator application
        shell: bash
        working-directory: ${{ inputs.project_path }}
        env:
          PROJECT: ${{ steps.project.outputs.project }}
          SCHEME: ${{ steps.project.outputs.scheme }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/SimulatorData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Capture real simulator preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Output"
          APP_PATH="$(find "$RUNNER_TEMP/SimulatorData/Build/Products" -path '*Release-iphonesimulator/*.app' -type d -print -quit)"
          test -n "$APP_PATH"
          test -s "$APP_PATH/Assets.car" || {
            echo "::error::Assets.car is missing from the app bundle"
            exit 1
          }

          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          items = [x["identifier"] for x in json.load(sys.stdin)["runtimes"]
                   if x.get("isAvailable") and "SimRuntime.iOS" in x.get("identifier", "")]
          if not items: raise SystemExit("No iOS runtime")
          print(items[-1])
          ')"
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          items = [x for x in json.load(sys.stdin)["devicetypes"]
                   if x.get("name", "").startswith("iPhone")]
          preferred = [x for x in items if x.get("name") == "iPhone 16 Pro"]
          print((preferred or items)[-1]["identifier"])
          ')"
          DEVICE_ID="$(xcrun simctl create "IPABuilder-${{ inputs.job_id }}" "$DEVICE_TYPE" "$RUNTIME_ID")"
          cleanup() {
            xcrun simctl shutdown "$DEVICE_ID" >/dev/null 2>&1 || true
            xcrun simctl delete "$DEVICE_ID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/Output/app-preview.png"

      - name: Build unsigned iPhone application
        shell: bash
        working-directory: ${{ inputs.project_path }}
        env:
          PROJECT: ${{ steps.project.outputs.project }}
          SCHEME: ${{ steps.project.outputs.scheme }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DeviceData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/DeviceData/Build/Products" -path '*Release-iphoneos/*.app' -type d -print -quit)"
          test -n "$APP_PATH"
          test -s "$APP_PATH/Assets.car" || {
            echo "::error::Assets.car is missing from the device app bundle"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/Output/app-unsigned.ipa"
          shasum -a 256 "$RUNNER_TEMP/Output/app-unsigned.ipa" > "$RUNNER_TEMP/Output/app-unsigned.ipa.sha256"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ipa-output
          path: ${{ runner.temp }}/Output/*
          if-no-files-found: error
          retention-days: 1
